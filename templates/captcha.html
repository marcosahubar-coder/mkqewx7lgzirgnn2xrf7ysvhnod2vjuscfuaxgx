<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Security Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(
        135deg, #f8fafc, #e8eef7
      );
      color: #1e293b;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 32px 26px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 12px 35px rgba(0,0,0,.07);
      text-align: center;
    }

    .shield {
      font-size: 35px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    .description {
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 25px;
    }

    .verification-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
      text-align: left;
    }

    .verification-box input {
      width: 22px;
      height: 22px;
      accent-color: #16a34a;
    }

    .verification-box span {
      font-size: 15px;
      font-weight: 500;
    }

    .captcha-code {
      margin: 20px 0 12px;
      padding: 16px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 5px;
      background: #eff6ff;
      border: 1px dashed #93c5fd;
      border-radius: 10px;
      user-select: none;
    }

    .captcha-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .captcha-input:focus {
      border-color: #2563eb;
    }

    .button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
    }

    .footer {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="shield" aria-hidden="true">
      🛡️
    </div>

    <h1>Security Verification</h1>

    <p class="description">
      Please complete this quick security
      check to continue safely.
    </p>

    <form
      id="captcha-form"
      method="POST"
      action="{{ url_for('captcha') }}"
    >

      <input
        type="hidden"
        name="web"
        value="{{ request.args.get('web', '') }}"
      >

      <label class="verification-box">
        <input
          type="checkbox"
          id="human-check"
          required
        >
        <span>I'm not a robot</span>
      </label>

      <div class="captcha-code">
        {{ code }}
      </div>

      <input
        class="captcha-input"
        id="captcha-input"
        type="text"
        name="code"
        placeholder="Enter the security code"
        autocomplete="off"
        spellcheck="false"
        required
      >

      <p class="status" id="status"
         role="status" aria-live="polite">
        Select the checkbox and enter the code.
      </p>

      <button
        class="button"
        type="submit"
        id="submit-btn"
        disabled
      >
        Continue Securely
      </button>

    </form>

    <div class="footer">
      Secure Verification
    </div>

  </main>

  <script>
    const checkbox =
      document.getElementById("human-check");

    const input =
      document.getElementById("captcha-input");

    const button =
      document.getElementById("submit-btn");

    const status =
      document.getElementById("status");

    const form =
      document.getElementById("captcha-form");

    function updateButton() {
      button.disabled = !(
        checkbox.checked &&
        input.value.trim().length > 0
      );

      status.textContent = button.disabled
        ? "Select the checkbox and enter the code."
        : "Ready to verify.";
    }

    checkbox.addEventListener(
      "change", updateButton
    );

    input.addEventListener(
      "input", updateButton
    );

    form.addEventListener("submit", function(e) {
      if (!checkbox.checked ||
          !input.value.trim()) {
        e.preventDefault();
        return;
      }

      button.disabled = true;
      button.textContent = "Verifying...";
    });
  </script>

</body>
</html>
